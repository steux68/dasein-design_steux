<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dasein-design Big Stripes</title>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
<style>
/* Layout: exact 1440×1024 Figma frames, absolutely positioned, stacked as one strip and scaled to fit the screen */
:root{
  --paper:#ffffff; --ink:#1d1d1b; --mute:#8a8a8a; --rule:#b8b8b8;
  --tab:#ededed; --lime:#d4f53c; --red:#e30613; --pin:#c4c4c4;
  --font:"Open Sans","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--font);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.strip{position:relative;width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px;overflow:hidden}
.holder{position:relative;flex:none;width:calc(1440px * var(--s,0.5));height:calc(1024px * var(--s,0.5))}
.mnav{display:none;flex-wrap:wrap;justify-content:center;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.mnav a{background:var(--tab);font-size:13px;padding:5px 10px;white-space:nowrap}
.mnav a small{font-size:9px}
.mnav a.on{background:var(--lime);font-weight:700}

.stage{position:relative;width:1440px;height:1024px;position:absolute;left:0;top:0;transform:scale(var(--s,0.5));transform-origin:0 0;background:var(--paper)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer > *{position:absolute;pointer-events:auto}
.scroller{position:absolute;left:225px;top:0;width:1100px;height:1024px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.pg{position:relative;height:1024px;width:1100px;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.pc{position:absolute;left:-225px;top:0;width:1440px;height:1024px}
.pc > *{position:absolute}
.mask{position:absolute;background:var(--paper)}
.mask.l{left:0;top:0;width:225px;height:1024px}
.mask.r{left:1325px;top:0;width:115px;height:1024px}
.mask.t{left:225px;top:0;width:1100px;height:40px}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* chrome */
.vl{width:0;height:1024px;top:0;border-left:1px dotted var(--rule)}
.tk{width:10px;height:0;border-top:1px solid var(--rule)}
.tab{height:25px;width:200px;top:0;background:var(--tab);font-size:13px;line-height:25px;text-align:center;cursor:pointer}
.tab small{font-size:9px}
.tab.on{background:var(--lime);font-weight:700}
.tab:hover{filter:brightness(.95)}
.rot{transform-origin:0 0;transform:rotate(-90deg);white-space:nowrap;line-height:1}
.brand{color:var(--red);font-weight:700;font-size:44px;letter-spacing:-.5px}
.label{font-size:46px;font-weight:400;color:#3c3c3b}
.label small{font-size:18px}
.ghost{background:repeating-linear-gradient(90deg,#e9e9e9 0 2px,transparent 2px 7px)}
.copy{font-size:10px}
.ico{width:18px;height:18px;background:var(--ink);border-radius:2px}

/* content */
.img{border-radius:0}
.cap{background:rgba(255,255,255,.92);font-size:11px;font-weight:700;padding:3px 4px;line-height:1.25;text-transform:uppercase}
.cap span{display:block;font-weight:400;text-transform:none;font-size:10px}
.t{font-size:10.5px;line-height:1.4;overflow:hidden}
.t b{font-weight:700}
.t.xs{font-size:8.3px;line-height:1.32}
.bar{background:var(--ink)}
.pdf{width:25px;height:25px;background:var(--red);color:#fff;font-size:8px;font-weight:700;display:grid;place-items:center}
.pdfl{font-size:10px;line-height:25px;white-space:nowrap}
.linkcap{font-size:10px;line-height:1.3;text-align:left}
.linkcap b{display:block;font-size:11px}
.pin{width:30px;height:30px;border-radius:50%;background:var(--pin);border:1px solid var(--ink);font-size:12px;display:grid;place-items:center;transition:background .2s}
.pin:hover,.pin.on{background:var(--lime)}
.dash{border-color:var(--ink);border-style:dotted;border-width:0}
.tri{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:15px solid var(--ink)}
.zoom{width:25px;height:25px;background:#fff;border:1px solid var(--ink);font-size:16px;line-height:22px;text-align:center}
</style>

<div class="strip" id="strip"></div>

<script>
const P=["#c9d6df","#e3c9b8","#cfd8c2","#d9c9de","#e6dcb5","#bfcfe0","#e0c3c8","#c6dcd6"];
let pi=0; const col=()=>P[(pi++)%P.length];
const TABS=[["services","us &amp; our services","01"],["projects","projects","02"],["downloads","downloads &amp; links","03"],["bits","bits &amp; bats","04"],["contact","contact","05"]];
const X=[235,455,675,895,1115];

function box(cls,x,y,w,h,html="",extra=""){return `<div class="${cls}" style="left:${x}px;top:${y}px;${w!=null?`width:${w}px;`:""}${h!=null?`height:${h}px;`:""}${extra}">${html}</div>`}
function link(cls,href,x,y,w,h,html="",extra=""){return `<a class="${cls}" href="#${href}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}">${html}</a>`}
const img=(x,y,w,h)=>box("img",x,y,w,h,"",`background:${col()}`);
const cap=(x,y,w,h,t)=>box("cap",x,y,w,h,`${t}<span>smaller text example</span>`);
const txt=(x,y,w,h,html,c="t")=>box(c,x,y,w,h,html);
const bar=(x,y,w,h)=>box("bar",x,y,w,h);
const pdf=(ix,y,lx,lw,label,href)=>link("pdf",href,ix,y,25,25,"PDF")+box("pdfl",lx,y,lw,25,label);

function chrome(active,label){
  let h="";
  [115,225,445,665,885,1105,1325].forEach(x=>h+=box("vl",x,0,null,null));
  [25,50,60,240,250,430,440,620,630,810,820,1000,1010].forEach(y=>{h+=box("tk",115,y,null,null)+box("tk",1335,y,null,null)});
  h+=box("ghost",125,430,90,570);
  h+=`<a href="#intro" style="left:141px;top:0;width:50px;height:50px" aria-label="dasein-design home"><svg viewBox="0 0 50 50" width="50" height="50"><circle cx="12.5" cy="37.5" r="12.5" fill="var(--red)"/><rect x="25" y="0" width="25" height="50" fill="var(--red)"/><circle cx="37.5" cy="37.5" r="12.5" fill="var(--paper)"/></svg></a>`;
  h+=link("brand rot","intro",130,360,300,60,"dasein-design");
  h+=box("label rot",128,1000,560,84,label);
  TABS.forEach(([id,n,num],i)=>h+=link("tab"+(i===active?" on":""),id,X[i],0,200,25,`${n} <small>[${num}]</small>`));
  h+=`<div style="left:1333px;top:2px"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="var(--ink)" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg></div>`;
  [57,82,107].forEach(y=>h+=box("ico",1338,y+3,null,null));
  h+=box("copy rot",1331,1020,252,30,"<b>©</b> <b>2022</b> [ dasein-design &amp; steux ]");
  return h;
}

const LABELS={intro:'architecture &amp; design <small>[...]</small>',services:'us &amp; our services <small>[01]</small>',projects:'projects <small>[02]</small>',downloads:'downloads &amp; links <small>[03]</small>',bits:'bits &amp; bats <small>[04]</small>',contact:'contact <small>[05]</small>'};

/* one fixed stage: grid lines behind, pages scroll in the middle, menus and side bar on top */
const ch=chrome(-1,LABELS.intro);
const inner=/<div class="vl" style="left:(445|665|885|1105)px[^>]*><\/div>/g;
const lines=(ch.match(inner)||[]).join("");
const chromeHtml=ch.replace(inner,"");
document.getElementById("strip").innerHTML=`<nav class="mnav" aria-label="Sections">${TABS.map(([id,n,num])=>`<a href="#${id}">${n} <small>[${num}]</small></a>`).join("")}</nav><div class="holder"><div class="stage" id="stage">
  <div class="layer">${lines}</div>
  <div class="scroller" id="scroller">${pages.map(([id,h])=>`<section class="pg" id="${id}"><div class="pc">${h}</div></section>`).join("")}</div>
  <div class="mask l"></div><div class="mask r"></div><div class="mask t"></div>
  <div class="layer chrome">${chromeHtml}</div>
</div></div>`;
const scroller=document.getElementById("scroller");
const pgs=[...scroller.children];
const labelEl=document.querySelector(".chrome .label");
const tabs=[...document.querySelectorAll(".chrome .tab, .mnav a")];

function go(id,instant){const el=document.getElementById(id); if(!el) return;
  scroller.scrollTo({top:el.offsetTop,behavior:instant||matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]'); if(!a) return; e.preventDefault(); go(a.getAttribute("href").slice(1));});

let cur="";
function update(){
  const i=Math.round(scroller.scrollTop/1024); const id=pgs[Math.max(0,Math.min(pgs.length-1,i))].id;
  if(id===cur) return; cur=id;
  labelEl.innerHTML=LABELS[id];
  tabs.forEach(t=>t.classList.toggle("on",t.getAttribute("href")==="#"+id||(id==="intro"&&t.getAttribute("href")==="#projects")));
}
scroller.addEventListener("scroll",update,{passive:true});

function fit(){
  const w=document.documentElement.clientWidth||innerWidth;
  const h=innerHeight-16;
  let s=Math.min(w/1440, h>200 ? h/1024 : Infinity);
  const small=s<0.5;
  document.documentElement.classList.toggle("small-screen",small);
  document.documentElement.style.setProperty("--s",s);
}
fit(); addEventListener("resize",fit);

addEventListener("keydown",e=>{
  const d={ArrowDown:1,PageDown:1,ArrowRight:1," ":1,ArrowUp:-1,PageUp:-1,ArrowLeft:-1}[e.key]; if(!d) return;
  e.preventDefault(); const i=Math.round(scroller.scrollTop/1024)+d;
  const n=pgs[Math.max(0,Math.min(pgs.length-1,i))]; go(n.id);
});
if(location.hash) go(location.hash.slice(1),true);
update();
</script>
